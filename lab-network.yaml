AWSTemplateFormatVersion: 2010-09-09
# CHANGED: Description updated to describe the new two-AZ network (lab: "Sample template that creates a VPC with DNS and public IPs enabled.")
Description: >-
  Network Template: Highly available VPC for the cafe application, spread over two
  Availability Zones, with public, private application and private database subnets.

# This template creates:
#   VPC
#   Internet Gateway
#   Public Route Table
#   2 Public Subnets (one per AZ)       -> Application Load Balancer, Bastion host, NAT gateways
#   2 Private App Subnets (one per AZ)  -> Auto Scaling group web servers
#   2 Private DB Subnets (one per AZ)   -> RDS Multi-AZ database
#   1 or 2 NAT Gateways (one per AZ by default) and Private Route Tables
#
# Every subnet ID is exported so the application stack can import it with Fn::ImportValue.
#
# ---------------------------------------------------------------------------------------------
# CHANGE LOG (compared with the original lab-network.yaml from the class lab)
#   ADDED:   Metadata section that groups the parameters in the CloudFormation console
#   ADDED:   Parameters section (VPC + 6 subnet CIDR blocks, NatGatewayPerAZ switch)
#   ADDED:   Conditions section (CreateSecondNatGateway)
#   CHANGED: VPC CidrBlock uses the VpcCidr parameter instead of a hard-coded 10.0.0.0/16
#   ADDED:   Name tags on the VPC, Internet Gateway, route tables, subnets and NAT gateways
#   CHANGED: PublicSubnet renamed to PublicSubnet1, CIDR from a parameter, MapPublicIpOnLaunch: true
#   ADDED:   PublicSubnet2 in the second AZ + its route table association
#   ADDED:   NAT gateway + Elastic IP per AZ (second one optional with NatGatewayPerAZ)
#   ADDED:   Private route table per AZ with a default route to the NAT gateway
#   ADDED:   2 private application subnets and 2 private database subnets (one per AZ) + associations
#   REMOVED: PublicSubnetNetworkAclAssociation (every subnet is already associated with the
#            VPC default network ACL automatically, so the resource was not needed)
#   CHANGED: Outputs - the original VPCID and SubnetID exports are kept for compatibility,
#            and 6 new exports were added (2 public, 2 app and 2 DB subnet IDs)
# ---------------------------------------------------------------------------------------------

# ADDED: Metadata - groups and orders the parameters on the CloudFormation console "Specify stack details" page
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: VPC
        Parameters:
          - VpcCidr
          - NatGatewayPerAZ
      - Label:
          default: Subnet CIDR blocks
        Parameters:
          - PublicSubnet1Cidr
          - PublicSubnet2Cidr
          - AppSubnet1Cidr
          - AppSubnet2Cidr
          - DBSubnet1Cidr
          - DBSubnet2Cidr

######################
# Parameters section
######################

# ADDED: Parameters section (the lab template had no parameters; all CIDR blocks were hard-coded).
# Every CIDR block can now be changed so the same template can build other networks.
Parameters:

  # ADDED: CIDR block of the VPC (was hard-coded 10.0.0.0/16)
  VpcCidr:
    Description: CIDR block of the VPC
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'
    ConstraintDescription: Must be a valid CIDR block, for example 10.0.0.0/16

  # ADDED: CIDR block of public subnet AZ1 (was hard-coded 10.0.0.0/24)
  PublicSubnet1Cidr:
    Description: Public subnet in the first Availability Zone
    Type: String
    Default: 10.0.0.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'

  # ADDED: CIDR block of the new public subnet AZ2
  PublicSubnet2Cidr:
    Description: Public subnet in the second Availability Zone
    Type: String
    Default: 10.0.1.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'

  # ADDED: CIDR block of the new private application subnet AZ1
  AppSubnet1Cidr:
    Description: Private application subnet in the first Availability Zone
    Type: String
    Default: 10.0.2.0/23
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'

  # ADDED: CIDR block of the new private application subnet AZ2
  AppSubnet2Cidr:
    Description: Private application subnet in the second Availability Zone
    Type: String
    Default: 10.0.4.0/23
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'

  # ADDED: CIDR block of the new private database subnet AZ1
  DBSubnet1Cidr:
    Description: Private database subnet in the first Availability Zone
    Type: String
    Default: 10.0.128.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'

  # ADDED: CIDR block of the new private database subnet AZ2
  DBSubnet2Cidr:
    Description: Private database subnet in the second Availability Zone
    Type: String
    Default: 10.0.129.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'

  # ADDED: choose between one NAT gateway per AZ (high availability) or one shared NAT gateway (cheaper)
  NatGatewayPerAZ:
    Description: >-
      true = one NAT gateway per Availability Zone (highly available).
      false = a single NAT gateway shared by both AZs (cheaper, for testing).
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

######################
# Conditions section
######################

# ADDED: Conditions section - the second NAT gateway is only created when NatGatewayPerAZ = true
Conditions:
  CreateSecondNatGateway: !Equals [!Ref NatGatewayPerAZ, 'true']

######################
# Resources section
######################

Resources:

  ## VPC

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      EnableDnsSupport: true
      EnableDnsHostnames: true
      # CHANGED: CIDR block comes from the VpcCidr parameter (lab: hard-coded 10.0.0.0/16)
      CidrBlock: !Ref VpcCidr
      # ADDED: Name tag so the VPC is easy to find in the console
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  ## Internet Gateway

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    # ADDED: Name tag
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  ## Public Route Table

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      # ADDED: Name tag
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rtb-public'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  ## Public Subnets (one per AZ)

  # CHANGED: renamed from PublicSubnet to PublicSubnet1 because there are now two public subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      # CHANGED: CIDR block comes from a parameter (lab: hard-coded 10.0.0.0/24)
      CidrBlock: !Ref PublicSubnet1Cidr
      # ADDED: instances launched here (bastion host) get a public IP automatically
      MapPublicIpOnLaunch: true
      # CHANGED: short form of the same AZ selection as the lab (first AZ of the Region)
      AvailabilityZone: !Select [0, !GetAZs '']
      # ADDED: Name tag
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-az1'

  # ADDED: second public subnet in the second AZ (needed by the Application Load Balancer and NAT gateway AZ2)
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-az2'

  # CHANGED: renamed from PublicSubnetRouteTableAssociation and points to PublicSubnet1
  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  # ADDED: associates public subnet AZ2 with the public route table (route to the Internet Gateway)
  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # REMOVED: PublicSubnetNetworkAclAssociation (lab) - it associated the public subnet with the
  # VPC default network ACL, which AWS already does automatically for every new subnet.

  ## NAT Gateways (one per AZ, or one shared when NatGatewayPerAZ = false)

  # ADDED: Elastic IP for NAT gateway AZ1
  NatGateway1EIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-az1-eip'

  # ADDED: NAT gateway AZ1 - lets the private app servers reach the internet (updates, AWS APIs)
  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway1EIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-az1'

  # ADDED: Elastic IP for NAT gateway AZ2 (only when NatGatewayPerAZ = true)
  NatGateway2EIP:
    Type: AWS::EC2::EIP
    Condition: CreateSecondNatGateway
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-az2-eip'

  # ADDED: NAT gateway AZ2 so that AZ2 keeps internet access if AZ1 fails (only when NatGatewayPerAZ = true)
  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: CreateSecondNatGateway
    Properties:
      AllocationId: !GetAtt NatGateway2EIP.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-az2'

  ## Private Route Tables (one per AZ, each pointing to a NAT gateway)

  # ADDED: private route table AZ1
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rtb-private-az1'

  # ADDED: default route of private route table AZ1 -> NAT gateway AZ1
  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  # ADDED: private route table AZ2
  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rtb-private-az2'

  # ADDED: default route of private route table AZ2 -> NAT gateway AZ2 (or NAT gateway AZ1 when only one NAT gateway is created)
  PrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [CreateSecondNatGateway, !Ref NatGateway2, !Ref NatGateway1]

  ## Private Application Subnets (one per AZ)

  # ADDED: private application subnet AZ1 (Auto Scaling group instances)
  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref AppSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-app-az1'

  # ADDED: private application subnet AZ2 (Auto Scaling group instances)
  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref AppSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-app-az2'

  # ADDED: app subnet AZ1 uses private route table AZ1
  AppSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  # ADDED: app subnet AZ2 uses private route table AZ2
  AppSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  ## Private Database Subnets (one per AZ)

  # ADDED: private database subnet AZ1 (RDS primary or standby)
  DBSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref DBSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-db-az1'

  # ADDED: private database subnet AZ2 (RDS primary or standby) - RDS Multi-AZ needs subnets in two AZs
  DBSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref DBSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-db-az2'

  # ADDED: DB subnet AZ1 uses private route table AZ1
  DBSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DBSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  # ADDED: DB subnet AZ2 uses private route table AZ2
  DBSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DBSubnet2
      RouteTableId: !Ref PrivateRouteTable2

######################
# Outputs section
######################

Outputs:

  # Kept from the lab: VPC ID exported as <stack-name>-VPCID
  VPC:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPCID'

  # CHANGED: kept the lab export name <stack-name>-SubnetID so older application templates still work,
  # but the value now points to PublicSubnet1 (the resource was renamed)
  PublicSubnet:
    Description: The subnet ID to use for public web servers (same as PublicSubnet1)
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-SubnetID'

  # ADDED: export of public subnet AZ1 (bastion host, load balancer)
  PublicSubnet1:
    Description: Public subnet in AZ 1
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet1ID'

  # ADDED: export of public subnet AZ2 (load balancer)
  PublicSubnet2:
    Description: Public subnet in AZ 2
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet2ID'

  # ADDED: export of private app subnet AZ1 (Auto Scaling group)
  AppSubnet1:
    Description: Private application subnet in AZ 1
    Value: !Ref AppSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-AppSubnet1ID'

  # ADDED: export of private app subnet AZ2 (Auto Scaling group)
  AppSubnet2:
    Description: Private application subnet in AZ 2
    Value: !Ref AppSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-AppSubnet2ID'

  # ADDED: export of private DB subnet AZ1 (RDS DB subnet group)
  DBSubnet1:
    Description: Private database subnet in AZ 1
    Value: !Ref DBSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-DBSubnet1ID'

  # ADDED: export of private DB subnet AZ2 (RDS DB subnet group)
  DBSubnet2:
    Description: Private database subnet in AZ 2
    Value: !Ref DBSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-DBSubnet2ID'
